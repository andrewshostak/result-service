name: Functional tests

on:
  push:
    branches-ignore: [main]

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: true

      - name: Run functional tests
        run: make functional-tests
